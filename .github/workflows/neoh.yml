name: neoh-Renew

on:
  workflow_dispatch:

jobs:
  run_renewal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/renew_tasks
          token: ${{ secrets.GH_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
  
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests
          
      - name: Setup chromedriver
        run: |
          seleniumbase install chromedriver
          
      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NEOH_VLINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          
      - name: Run Task (CF-Bypass Mode)
        env:
          NEOH_AUTH: ${{ secrets.NEOH_AUTH }}
          TG_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_USERID }}
          NEOH_COOKIE: ${{ secrets.NEOH_COOKIE }}
          PROXY : http://127.0.0.1:1081
        run: |
          xvfb-run -a python neohe-sb.py
