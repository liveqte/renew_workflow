name: MWS auto renew

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1,3,5' # 北京时间每周一、三、五 09:00

permissions:
  contents: read

concurrency:
  group: mws-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout renew_tasks
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/renew_tasks
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          # pysocks：requests 走 socks5:// 代理必需
          python -m pip install 'requests>=2.31.0,<3' pysocks seleniumbase
          seleniumbase install chromedriver

      # WARP 已停用：改用 VLINK → 本地 sing-box（socks5://127.0.0.1:1080）
      # - name: 启用 WARP 网络
      #   uses: fscarmen/warp-on-actions@v1.3
      #   with:
      #     stack: dual
      #     mode: client

      - name: Launch sing-box (SWITCHED_VLINK)
        env:
          VLINK: ${{ secrets.SWITCHED_VLINK }}
        run: |
            if [ -z "$VLINK" ]; then
              echo "::error::缺少 SWITCHED_VLINK secret（Settings → Secrets and variables → Actions）"
              exit 1
            fi
            curl -LO https://amd64.ssss.nyc.mn/sb
            curl -LO https://raw.githubusercontent.com/liveqte/jupyter-notebook-deployed/refs/heads/main/vlink_to_sb.py
            chmod +x sb
            python vlink_to_sb.py "$VLINK" > v.json
            echo "v.json size: $(wc -c < v.json) bytes"
            nohup ./sb run -c v.json > sb.log 2>&1 &
            sleep 5
            if ! ss -tln 2>/dev/null | grep -q ':1080'; then
              echo "::error::sing-box 未在 1080 端口监听，最后日志："
              tail -n 15 sb.log | sed -E 's/[A-Za-z0-9+\/=]{24,}/[MASKED]/g'
              exit 1
            fi
            echo "✅ sing-box 已监听 1080"
            # requests 通过 trust_env 自动读取这几个变量；
            # api.github.com 直连，避免 gh 回写 MWS_TOKEN 受节点影响。
            {
              echo "PROXY=socks5://127.0.0.1:1080"
              echo "HTTP_PROXY=socks5://127.0.0.1:1080"
              echo "HTTPS_PROXY=socks5://127.0.0.1:1080"
              echo "ALL_PROXY=socks5://127.0.0.1:1080"
              echo "NO_PROXY=127.0.0.1,localhost,api.github.com,github.com"
            } >> "$GITHUB_ENV"

      - name: Run MWS renewal
        env:
          MWS_TOKEN: ${{ secrets.MWS_TOKEN }}
          # 自动换票使用 Discord 登录；GH_TOKEN 需有本仓库 Actions Secrets 写权限
          # （脚本用 gh secret set --repo "$GITHUB_REPOSITORY" 回写 MWS_TOKEN，即 renew_workflow）
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # TG 通知复用 renew_workflow 已有的 TG_TOKEN / TG_USERID，也兼容同名 secret
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TG_USERID }}
          MWS_API: ${{ vars.MWS_API }}
          MWS_REFRESH_BEFORE_DAYS: ${{ vars.MWS_REFRESH_BEFORE_DAYS || '7' }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
        run: |
          if [ -z "$MWS_TOKEN" ] && [ -z "$DISCORD_TOKEN" ]; then
            echo "::error::缺少 MWS_TOKEN 且未配置 DISCORD_TOKEN，无法换票"
            exit 1
          fi
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" python -u mws-sb.py
