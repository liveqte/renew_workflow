name: wisp keep

on:
  schedule:
    - cron: '22 1 */4 * *'
  workflow_dispatch: # 允许在 Actions 页面手动触发

jobs:
  add_time:
    runs-on: ubuntu-latest 

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/renew_tasks
          token: ${{ secrets.GH_TOKEN }}
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip curl gnupg
          
      - uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 144
          
      - name: Set up Python 
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase pyvirtualdisplay requests
          
      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client
          
      - name: Run Time Adder Script 
        env:
           WISPBYTE_1: ${{ secrets.WISPBYTE_1 }}
           TG_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
           TG_CHAT_ID: ${{ secrets.TG_USERID }}
        run: |
          python wisp-sb.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wisp-debug
          path: output/screenshots/
          retention-days: 3
