name: plugged tokens daily

on:
  workflow_dispatch: # 允许在 Actions 页面手动触发此工作流，方便测试；勾选 debug 才上传运行信息
    inputs:
      debug:
        description: '调试模式：上传运行信息工件并输出完整诊断'
        type: boolean
        default: false
  schedule:
    - cron: '43 0 * * *' # UTC 00:43（北京 08:43），面板为 UTC 时区，streak 午夜重置后尽快执行（避开 switched 的 00:23）

# 避免定时任务与手动触发同时运行
concurrency:
  group: plugged-tokens
  cancel-in-progress: false

jobs:
  earn_tokens:
    runs-on: ubuntu-latest # 与 switched 同款出口（GitHub 托管 runner 直连）
    timeout-minutes: 40

    permissions:
      contents: read

    env:
      TASK_DEBUG: ${{ inputs.debug == true && '1' || '0' }}

    steps:
      - name: Checkout renew_tasks
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/renew_tasks
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python package
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase loguru pysocks

      - name: Check proxy link
        id: proxy
        env:
          # 优先专用节点；没有则复用 switched 的节点
          VLINK: ${{ secrets.PLUGGED_VLINK || secrets.SWITCHED_VLINK }}
        run: |
          if [ -n "$VLINK" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch sing-box if VLINK set
        if: ${{ steps.proxy.outputs.enabled == 'true' }}
        env:
          VLINK: ${{ secrets.PLUGGED_VLINK || secrets.SWITCHED_VLINK }}
        run: |
            curl -LO https://amd64.ssss.nyc.mn/sb
            curl -LO https://raw.githubusercontent.com/liveqte/jupyter-notebook-deployed/refs/heads/main/vlink_to_sb.py
            chmod +x sb
            python vlink_to_sb.py "$VLINK" > v.json
            echo "v.json size: $(wc -c < v.json) bytes"
            nohup ./sb run -c v.json > sb.log 2>&1 &
            sleep 5
            if ! ss -tln 2>/dev/null | grep -q ':1080'; then
              echo "::error::sing-box 未在 1080 端口监听，最后日志："
              tail -n 15 sb.log | sed -E 's/[A-Za-z0-9+\/=]{24,}/[MASKED]/g'
              exit 1
            fi
            echo "✅ sing-box 已监听 1080"
            echo "PROXY=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"

      - name: Verify local proxy port
        run: |
          if ! ss -tln 2>/dev/null | grep -q ':1080'; then
            echo "::error::BROWSER_PROXY 指向 socks5://127.0.0.1:1080，但没有本地代理监听；请设置 PLUGGED_VLINK 或 SWITCHED_VLINK"
            exit 1
          fi

      - name: Run plugged tokens script
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
          # noprofit 账号（必填）
          NOPROFIT_LOGIN: ${{ secrets.NOPROFIT_LOGIN }}
          NOPROFIT_PASSWORD: ${{ secrets.NOPROFIT_PASSWORD }}
          # 浏览器固定走本地 sing-box（requests 的 PROXY 由上一步写入 GITHUB_ENV）
          BROWSER_PROXY: socks5://127.0.0.1:1080
          # TG 通知复用 renew_workflow 已有的 TG_TOKEN / TG_USERID，也兼容同名 secret
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TG_USERID }}
        run: |
          if [ -z "$NOPROFIT_LOGIN" ] || [ -z "$NOPROFIT_PASSWORD" ]; then
            echo "::error::缺少 NOPROFIT_LOGIN / NOPROFIT_PASSWORD secret（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          export TMPDIR="$GITHUB_WORKSPACE/.tmp"
          echo "Using TMPDIR=$TMPDIR"
          echo "Using BROWSER_PROXY=$BROWSER_PROXY"
          python plugged-sb.py

      - name: Upload artifacts
        if: always() && env.TASK_DEBUG == '1'
        uses: actions/upload-artifact@v4
        with:
          name: plugged-artifacts-${{ github.run_number }}
          path: |
            screenshots
            plugged_cookie_latest.txt
          retention-days: 7
          if-no-files-found: ignore
