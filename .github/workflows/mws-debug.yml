name: mws proxy debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install python package
        run: python -m pip install --quiet requests pysocks

      - name: Launch sing-box (SWITCHED_VLINK)
        env:
          VLINK: ${{ secrets.SWITCHED_VLINK }}
        run: |
            curl -sLO https://amd64.ssss.nyc.mn/sb
            curl -sLO https://raw.githubusercontent.com/liveqte/jupyter-notebook-deployed/refs/heads/main/vlink_to_sb.py
            chmod +x sb
            python vlink_to_sb.py "$VLINK" > v.json
            nohup ./sb run -c v.json > sb.log 2>&1 &
            sleep 5
            echo "--- listening ---"
            ss -tlnp 2>/dev/null | grep ':1080' || echo "no listener"
            echo "--- sb process ---"
            ps -eo pid,cmd | grep -E '(^|/)sb run' | grep -v grep || echo "no sb process"
            echo "--- sb log tail ---"
            tail -n 10 sb.log | sed -E 's/[A-Za-z0-9+\/=]{24,}/[MASKED]/g'
            {
              echo "PROXY=socks5://127.0.0.1:1080"
              echo "HTTP_PROXY=socks5://127.0.0.1:1080"
              echo "HTTPS_PROXY=socks5://127.0.0.1:1080"
              echo "ALL_PROXY=socks5://127.0.0.1:1080"
              echo "NO_PROXY=127.0.0.1,localhost,api.github.com,github.com"
            } >> "$GITHUB_ENV"

      - name: Diagnose python requests
        run: |
          python - <<'PY'
          import os, requests, traceback
          print("HTTPS_PROXY =", os.getenv("HTTPS_PROXY"))
          print("NO_PROXY   =", os.getenv("NO_PROXY"))
          urls = [
              "https://discord.com/api/v10/gateway",
              "https://api.telegram.org",
              "https://cloud.m-ws.cc/api",
          ]
          for url in urls:
              try:
                  r = requests.get(url, timeout=20)
                  print(f"[env] {url} -> {r.status_code}")
              except Exception as e:
                  print(f"[env] {url} -> {type(e).__name__}: {e}")
          print("--- explicit socks5 ---")
          socks = {"http": "socks5://127.0.0.1:1080", "https": "socks5://127.0.0.1:1080"}
          for url in urls:
              try:
                  r = requests.get(url, timeout=20, proxies=socks)
                  print(f"[socks] {url} -> {r.status_code}")
              except Exception as e:
                  print(f"[socks] {url} -> {type(e).__name__}: {e}")
          print("--- socks5h (remote DNS) ---")
          socksh = {"http": "socks5h://127.0.0.1:1080", "https": "socks5h://127.0.0.1:1080"}
          for url in urls:
              try:
                  r = requests.get(url, timeout=20, proxies=socksh)
                  print(f"[socks5h] {url} -> {r.status_code}")
              except Exception as e:
                  print(f"[socks5h] {url} -> {type(e).__name__}: {e}")
          print("--- direct (no proxy) ---")
          s = requests.Session()
          s.trust_env = False
          for url in urls:
              try:
                  r = s.get(url, timeout=20)
                  print(f"[direct] {url} -> {r.status_code}")
              except Exception as e:
                  print(f"[direct] {url} -> {type(e).__name__}: {e}")
          PY

      - name: Diagnose curl
        run: |
          for url in https://discord.com/api/v10/gateway https://api.telegram.org https://cloud.m-ws.cc/api; do
            echo "== $url"
            curl -s -o /dev/null -w 'socks5  %{http_code} %{time_total}s\n' --max-time 20 -x socks5://127.0.0.1:1080 "$url" || echo "socks5 failed"
            curl -s -o /dev/null -w 'socks5h %{http_code} %{time_total}s\n' --max-time 20 -x socks5h://127.0.0.1:1080 "$url" || echo "socks5h failed"
          done
