name: therose-Renew

on:
  workflow_dispatch:

jobs:
  run_renewal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/renew_tasks
          token: ${{ secrets.GH_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
  
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests
          
      - name: Setup chromedriver
        run: |
          seleniumbase install chromedriver

      - name: Run Task (CF-Bypass Mode)
        env:
          EMAIL: ${{ secrets.ROSE_EMAIL }}
          PASSWORD: ${{ secrets.ROSE_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_USERID }}
        run: |
          xvfb-run -a python renew_therose.py
