name: xsystem keep

on:
  workflow_dispatch: # 允许在 Actions 页面手动触发
  schedule:
    - cron: '26 2 */2 * *'

jobs:
  add_time:
    runs-on: ubuntu-latest 

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/renew_tasks
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python 
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 指定具体版本更稳定

      - name: Install dependencies
        run: |
          # 安装你脚本实际需要的依赖：requests, beautifulsoup4, 以及支持 socks 的 PySocks
          pip install requests beautifulsoup4 PySocks

      - name: Export all secrets to env vars
        uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Run Time Adder Script 
        run: |
          python xsys-bs4.py
