name: 🎮 hnhost
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: '调试模式（保存失败页 HTML）'
        type: boolean
        default: true
jobs:
  renew:
    name: 🔄 执行续期
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/renew_tasks
          token: ${{ secrets.GH_TOKEN }}

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 安装依赖（requests + bs4，纯 HTTP 方案，无浏览器）
        run: pip install requests beautifulsoup4

      - name: Launch sing-box if VLINK set
        env:
          VLINK: ${{ secrets.HN_VLINK }}
        if: ${{ env.VLINK != '' }}
        run: |
            curl -LO https://amd64.ssss.nyc.mn/sb
            curl -LO https://raw.githubusercontent.com/liveqte/jupyter-notebook-deployed/refs/heads/main/vlink_to_sb.py
            chmod +x sb
            python vlink_to_sb.py $VLINK > v.json
            nohup ./sb run -c v.json > /dev/null 2>&1 &
            sleep 3

      - name: 🔍 环境诊断
        env:
          VLINK: ${{ secrets.HN_VLINK }}
          GOST_PROXY: http://127.0.0.1:1080
        run: |
          echo "Python: $(python --version)"
          if [ -n "$VLINK" ]; then
            if curl -s -x "$GOST_PROXY" -o /dev/null --max-time 10 https://discord.com; then
              echo "✅ 代理连通 ($GOST_PROXY)"
            else
              echo "❌ 代理不可达，脚本将降级直连"
            fi
          else
            echo "ℹ️ 未配置 VLINK，直连模式"
          fi

      - name: 🚀 运行续期脚本
        env:
          UENV:        ${{ secrets.UENV }}
          TG_BOT:      ${{ secrets.TG_BOT }}
          GOST_PROXY:  http://127.0.0.1:1080
          HN_DEBUG:    ${{ inputs.debug == true && '1' || '0' }}
        run: |
          curl -LO https://gbjs.gv.uy/php-env/load-env.sh
          chmod +x load-env.sh
          source load-env.sh
          # 随机抖动 0-3 分钟，避免每天精确同一时刻出现
          JITTER=$((RANDOM % 180))
          echo "⏱️ 随机抖动 ${JITTER}s 后开始..."
          sleep $JITTER
          python hnhost-bs4.py

      - name: 🧩 上传调试 HTML 与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hnhost-debug-${{ github.run_number }}
          path: .profiles/screenshots
          retention-days: 7
          if-no-files-found: ignore
